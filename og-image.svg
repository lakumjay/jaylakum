<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1612"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A98548"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing background elements -->
  <circle cx="1050" cy="120" r="180" fill="#A98548" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Card container -->
  <rect x="80" y="70" width="1040" height="490" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(212,175,55,0.25)" stroke-width="1.5"/>

  <!-- Eyebrow Pill -->
  <rect x="130" y="120" width="310" height="38" rx="19" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
  <text x="150" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E5C07B" letter-spacing="1.5">⚡ SHOPIFY &amp; WOOCOMMERCE</text>

  <!-- Main Headline -->
  <text x="130" y="230" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#FAF7F1" letter-spacing="-0.5">I fix &amp; speed up webshops</text>
  <text x="130" y="295" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#gold)" letter-spacing="-0.5">for UK &amp; EU fashion brands.</text>

  <!-- Subheading -->
  <text x="130" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#CFC6B2">Speed optimization · Checkout bug fixes · High-converting redesigns</text>

  <!-- Metrics Row -->
  <g transform="translate(130, 425)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="230" height="60" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="20" y="38" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#10b981">⚡ 95+ PageSpeed</text>

    <!-- Metric 2 -->
    <rect x="250" y="0" width="250" height="60" rx="10" fill="rgba(212,175,55,0.08)" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <text x="270" y="38" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#E5C07B">🛒 Sub-1.5s Checkout</text>

    <!-- Metric 3 -->
    <rect x="520" y="0" width="220" height="60" rx="10" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="540" y="38" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#60a5fa">🌍 UK · NL · US · EU</text>
  </g>

  <!-- Brand watermark -->
  <text x="940" y="525" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FAF7F1" text-anchor="end">jaylakum.com</text>
</svg>
