name: 24/7 Cloud SEO Autopilot
run-name: 24/7 SEO Audit & Auto-Fix (${{ github.event_name }})

on:
  schedule:
    # Runs automatically every 6 hours in GitHub Cloud (even when PC is turned off!)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

permissions:
  contents: write

jobs:
  seo-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & TrueType Fonts
        run: |
          pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Run SBMM SEO Audit & Auto-Fixer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/sbmm_audit_and_fix.py --no-push

      - name: Auto-Commit & Auto-Push If Fixes Applied
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚡ Code changes detected! Auto-committing and pushing to main branch..."
            git add -A
            git commit -m "chore(seo-cloud): 24/7 cloud autopilot applied SBMM SEO auto-fixes [skip ci]"
            git push origin main
            echo "✅ Successfully pushed to main! Webhook will auto-update live server."
          else
            echo "🎉 Codebase is 100% clean and compliant with SBMM SEO rules. No changes needed."
          fi
